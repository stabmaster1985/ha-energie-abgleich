name: Energie-Abgleich
version: "0.2.1"
slug: energie_abgleich
description: >-
  Prognose der Jahresabrechnung für Strom, Gas und Wasser aus den Zählern in
  Home Assistant und den Zahlungen in Firefly III.
url: https://github.com/stabmaster1985/ha-energie-abgleich
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-sync
panel_title: Energie-Abgleich
homeassistant_api: true
services:
  - mqtt:want
options:
  firefly_url: "http://192.168.1.10:8080"
  firefly_token: ""
  aktualisierung_minuten: 60
  eedc_url: ""
  ausschluss_stichworte: "Nachzahlung,Jahresabrechnung,Schlussrechnung,Erstattung,Guthaben"
  strom:
    aktiv: true
    kategorie: Strom
    preisquelle: eedc
    abrechnungsbeginn: "2026-01-01"
    arbeitspreis_ct_kwh: 30.0
    grundpreis_eur_monat: 12.0
    abschlag_eur: 0.0
    abschlaege_pro_jahr: 12
    prognose_methode: auto
    einspeisung_aktiv: false
    einspeiseverguetung_ct_kwh: 7.86
    einspeise_stichwort: Einspeis
  gas:
    aktiv: true
    kategorie: Gas
    abrechnungsbeginn: "2026-01-01"
    arbeitspreis_ct_kwh: 10.0
    grundpreis_eur_monat: 15.0
    abschlag_eur: 0.0
    abschlaege_pro_jahr: 12
    prognose_methode: auto
    brennwert: 11.2
    zustandszahl: 0.95
  wasser:
    aktiv: true
    kategorie: Gelsenwasser
    abrechnungsbeginn: "2026-01-01"
    preis_eur_m3: 2.0
    abwasser_eur_m3: 0.0
    grundpreis_eur_monat: 8.0
    abschlag_eur: 0.0
    abschlaege_pro_jahr: 12
    prognose_methode: auto
    max_m3_pro_tag: 2.0
schema:
  firefly_url: url
  firefly_token: password
  aktualisierung_minuten: int(5,1440)
  eedc_url: str?
  ausschluss_stichworte: str
  strom:
    aktiv: bool
    kategorie: str
    zaehler: str?
    einspeise_zaehler: str?
    preisquelle: list(eedc|manuell)?
    abrechnungsbeginn: match(^\d{4}-\d{2}-\d{2}$)
    arbeitspreis_ct_kwh: float(0,)
    grundpreis_eur_monat: float(0,)
    abschlag_eur: float(0,)
    abschlaege_pro_jahr: int(1,12)
    prognose_methode: list(auto|vorjahr|profil|linear)
    einspeisung_aktiv: bool
    einspeiseverguetung_ct_kwh: float(0,)
    einspeise_stichwort: str
  gas:
    aktiv: bool
    kategorie: str
    zaehler: str?
    abrechnungsbeginn: match(^\d{4}-\d{2}-\d{2}$)
    arbeitspreis_ct_kwh: float(0,)
    grundpreis_eur_monat: float(0,)
    abschlag_eur: float(0,)
    abschlaege_pro_jahr: int(1,12)
    prognose_methode: list(auto|vorjahr|profil|linear)
    brennwert: float(0,)
    zustandszahl: float(0,)
  wasser:
    aktiv: bool
    kategorie: str
    zaehler: str?
    abrechnungsbeginn: match(^\d{4}-\d{2}-\d{2}$)
    preis_eur_m3: float(0,)
    abwasser_eur_m3: float(0,)
    grundpreis_eur_monat: float(0,)
    abschlag_eur: float(0,)
    abschlaege_pro_jahr: int(1,12)
    prognose_methode: list(auto|vorjahr|profil|linear)
    max_m3_pro_tag: float(0,)
